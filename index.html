<!doctype html>
<html lang="zh-CN" class="love-locked">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>给你的小惊喜</title>
<link rel="stylesheet" href="gate.css" />
<script src="gate.js"></script>
<style>
  :root{--ink:#3a2630;--muted:#9b8590;--card:#fff;--line:#f1e6ec;--accent:#ff6f8e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink);
    background:radial-gradient(120% 80% at 50% -10%,#ffe6ee 0%,#fff4f7 45%,#fbf0f5 100%);
    min-height:100dvh;-webkit-font-smoothing:antialiased;
    padding:calc(env(safe-area-inset-top) + 42px) 20px calc(env(safe-area-inset-bottom) + 36px)}
  .box{max-width:440px;margin:0 auto}
  .hi{font-size:13px;letter-spacing:.34em;text-indent:.34em;color:var(--accent);font-weight:600}
  h1{font-family:"Songti SC","STSong",Georgia,serif;font-weight:400;font-size:30px;margin:10px 0 6px}
  h1 b{color:var(--accent);font-weight:400}
  .lead{color:var(--muted);font-size:14px;margin-bottom:26px}
  .grid{display:flex;flex-direction:column;gap:12px}
  a.card{display:flex;align-items:center;gap:15px;text-decoration:none;color:inherit;
    background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;
    box-shadow:0 8px 22px rgba(255,111,142,.08);transition:transform .16s,box-shadow .16s;
    -webkit-tap-highlight-color:transparent}
  a.card:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(255,111,142,.16)}
  a.card:active{transform:translateY(0) scale(.99)}
  a.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .emoji{font-size:28px;width:48px;height:48px;flex:none;display:grid;place-items:center;
    background:linear-gradient(135deg,#fff0f4,#ffe0ea);border-radius:14px}
  .t b{display:block;font-size:16px;font-weight:600}
  .t small{color:var(--muted);font-size:12.5px}
  .arrow{margin-left:auto;color:var(--accent);font-size:20px;opacity:.6}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:26px}
</style>
</head>
<body>
  <div class="box">
    <p class="hi">FOR YOU</p>
    <h1>嘿,<b id="her">宝贝</b> 💛</h1>
    <p class="lead">吴锐写给朱美琳的小惊喜，随便点开一个玩玩~</p>

    <nav class="grid">
      <a class="card" href="love-home.html">
        <span class="emoji">🌇</span>
        <span class="t"><b>我们的日子</b><small>在一起多少天了,来看看</small></span>
        <span class="arrow">→</span>
      </a>
      <a class="card" href="honghong.html">
        <span class="emoji">🥺</span>
        <span class="t"><b>哄哄模拟器</b><small>要是我惹你生气了…你先玩这个</small></span>
        <span class="arrow">→</span>
      </a>
      <a class="card" href="food-wheel.html">
        <span class="emoji">🍜</span>
        <span class="t"><b>今天吃什么</b><small>纠结的时候,交给转盘</small></span>
        <span class="arrow">→</span>
      </a>
    </nav>

    <footer>吴锐做给朱美琳的 · 2026.10.18 起</footer>
  </div>

<script src="config.js"></script>
<script>
  var c = window.COUPLE_CONFIG || {};
  document.getElementById("her").textContent = c.herName || "宝贝";
  document.title = "给" + (c.herName || "你") + "的小惊喜";
</script>
</body>
</html>
