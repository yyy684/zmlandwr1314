<!doctype html>
<html lang="zh-CN" class="love-locked">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>今天吃什么</title>
<link rel="stylesheet" href="gate.css?v=2" />
<script src="gate.js?v=2"></script>
<style>
  :root{--bg:#fff7f0;--ink:#3d2b2b;--muted:#9b8579;--accent:#ff6f61;--line:#f0e2d6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:radial-gradient(120% 120% at 50% 0%,#fff 0%,var(--bg) 60%);
    color:var(--ink);min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    padding:calc(env(safe-area-inset-top) + 26px) 20px 40px;-webkit-font-smoothing:antialiased}
  h1{font-size:24px;font-weight:800;letter-spacing:.02em}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:14px;margin-top:6px;margin-bottom:20px}
  .stage{position:relative;width:min(84vw,340px);height:min(84vw,340px)}
  .stage::after{ /* 指针 */
    content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);
    border-left:13px solid transparent;border-right:13px solid transparent;
    border-top:22px solid var(--accent);filter:drop-shadow(0 3px 4px rgba(0,0,0,.18));z-index:3}
  canvas{width:100%;height:100%;border-radius:50%;
    box-shadow:0 18px 40px rgba(255,111,97,.22),0 0 0 8px #fff,0 0 0 10px var(--line)}
  .hub{position:absolute;top:50%;left:50%;width:66px;height:66px;transform:translate(-50%,-50%);
    border-radius:50%;background:#fff;color:var(--accent);font-weight:800;font-size:15px;cursor:pointer;
    border:none;box-shadow:0 6px 16px rgba(0,0,0,.15);z-index:2;transition:transform .15s;
    -webkit-tap-highlight-color:transparent}
  .hub:active{transform:translate(-50%,-50%) scale(.92)}
  .hub:disabled{color:var(--muted);cursor:default}
  .result{margin-top:24px;font-size:15px;color:var(--muted);text-align:center;min-height:2.6em}
  .result b{font-size:26px;color:var(--accent);display:block;margin-top:4px}
  .editor{margin-top:22px;width:min(90vw,380px)}
  .editor summary{cursor:pointer;color:var(--muted);font-size:14px;list-style:none;text-align:center}
  .editor summary::-webkit-details-marker{display:none}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .tag{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:6px 10px 6px 12px;font-size:13px}
  .tag button{border:none;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1}
  .addrow{display:flex;gap:8px;margin-top:12px}
  .addrow input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:#fff}
  .addrow input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
  .addrow button{border:none;background:var(--accent);color:#fff;border-radius:10px;padding:0 16px;font:inherit;font-weight:600;cursor:pointer}
  @media (prefers-reduced-motion:reduce){canvas{transition:none!important}}
</style>
</head>
<body>
  <h1>今天吃<span>什么</span></h1>
  <p class="sub">世纪难题,交给天意 🎯</p>

  <div class="stage">
    <canvas id="wheel" width="680" height="680"></canvas>
    <button class="hub" id="spin">GO</button>
  </div>

  <p class="result" id="result">戳中间的 GO,开始转 👆</p>

  <details class="editor">
    <summary>⚙️ 改改选项</summary>
    <div class="tags" id="tags"></div>
    <div class="addrow">
      <input id="newOpt" placeholder="加一道想吃的菜" maxlength="24" />
      <button id="add">添加</button>
    </div>
  </details>

<script src="config.js"></script>
<script>
(function(){
  const cfg = window.COUPLE_CONFIG || {};
  const PALETTE = ["#ff8a80","#ffb74d","#ffd54f","#aed581","#4dd0e1","#7986cb","#ba68c8","#f06292","#4db6ac","#ff8f65"];
  let opts = (cfg.foodOptions&&cfg.foodOptions.length)?cfg.foodOptions.slice():["火锅","烧烤","日料","面条"];

  const cv=document.getElementById("wheel"), ctx=cv.getContext("2d");
  const R=cv.width/2, reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  let rot=0, spinning=false;

  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    const n=opts.length, arc=Math.PI*2/n;
    for(let i=0;i<n;i++){
      const a0=i*arc, a1=a0+arc;
      ctx.beginPath();ctx.moveTo(R,R);ctx.arc(R,R,R-4,a0,a1);ctx.closePath();
      ctx.fillStyle=PALETTE[i%PALETTE.length];ctx.fill();
      // 文字
      ctx.save();ctx.translate(R,R);ctx.rotate(a0+arc/2);
      ctx.textAlign="right";ctx.fillStyle="#fff";
      ctx.font="600 "+(opts.length>12?21:opts.length>8?26:32)+"px 'PingFang SC',sans-serif";
      ctx.shadowColor="rgba(0,0,0,.18)";ctx.shadowBlur=4;
      ctx.fillText(opts[i], R-34, 9, 145);
      ctx.restore();
    }
  }
  function render(){ cv.style.transform=`rotate(${rot}rad)`; }
  draw();

  function spin(){
    if(spinning||opts.length<2) return;
    spinning=true; const btn=document.getElementById("spin"); btn.disabled=true;
    document.getElementById("result").textContent="转呀转呀转…";
    const n=opts.length, arc=Math.PI*2/n;
    const winner=Math.floor(Math.random()*n);
    // 让 winner 扇区中心停到顶部指针(-90°)
    const target = -Math.PI/2 - (winner*arc + arc/2);
    const spins = reduce?0:(5+Math.floor(Math.random()*3));
    const finalRot = target - spins*Math.PI*2;
    const from=rot % (Math.PI*2), delta=finalRot-from, T=reduce?300:4200, t0=performance.now();
    (function anim(t){
      const p=Math.min(1,(t-t0)/T), e=1-Math.pow(1-p,4);
      rot=from+delta*e; render();
      if(p<1) requestAnimationFrame(anim);
      else{
        spinning=false; btn.disabled=false;
        const result=document.getElementById("result");
        result.textContent="今天就吃";
        const chosen=document.createElement("b");
        chosen.textContent=opts[winner];
        result.appendChild(chosen);
      }
    })(t0);
  }
  document.getElementById("spin").addEventListener("click",spin);

  // 选项编辑
  const tagsEl=document.getElementById("tags");
  function renderTags(){
    tagsEl.innerHTML="";
    opts.forEach((o,i)=>{
      const s=document.createElement("span");s.className="tag";
      s.append(document.createTextNode(o+" "));
      const remove=document.createElement("button");
      remove.type="button";
      remove.setAttribute("aria-label","删除 "+o);
      remove.textContent="×";
      remove.onclick=()=>{ if(opts.length>2){opts.splice(i,1);draw();renderTags();} };
      s.appendChild(remove);
      tagsEl.appendChild(s);
    });
  }
  renderTags();
  function add(){
    const inp=document.getElementById("newOpt"), v=inp.value.trim();
    if(v&&opts.length<30&&!opts.includes(v)){ opts.push(v);inp.value="";draw();renderTags(); }
  }
  document.getElementById("add").addEventListener("click",add);
  document.getElementById("newOpt").addEventListener("keydown",e=>{ if(e.key==="Enter")add(); });
})();
</script>
</body>
</html>
